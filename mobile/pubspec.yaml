name: tote_bag
description: A beautiful grocery shopping assistant with shared lists and barcode scanning
publish_to: "none"
version: 0.5.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  cached_network_image: ^3.4.1
  cupertino_icons: ^1.0.8
  dio: ^5.7.0
  flutter:
    sdk: flutter
  flutter_dotenv: ^6.0.0
  flutter_riverpod: ^2.6.1
  flutter_secure_storage: ^9.2.2
  flutter_svg: ^2.0.14
  go_router: ^14.6.2
  google_fonts: ^6.2.1
  http: ^1.2.2
  image_picker: ^1.2.1
  intl: ^0.19.0
  mobile_scanner: ^5.2.3
  shared_preferences: ^2.3.3
  shimmer: ^3.0.0
  uuid: ^4.5.1

dev_dependencies:
  build_runner: ^2.4.13
  flutter_launcher_icons: ^0.13.1
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter
  mockito: ^5.4.4

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/images/
    - assets/icons/

# App Icon Configuration
flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  web:
    generate: true
  image_path: "assets/icons/app-icon.png"
  adaptive_icon_background: "#1B6B4E"
  adaptive_icon_foreground: "assets/icons/app-icon.png"
