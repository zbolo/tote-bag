<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <!-- Subtle gradient for background -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1F7A58"/>
      <stop offset="100%" stop-color="#155E40"/>
    </linearGradient>
    <!-- Bag body gradient for depth -->
    <linearGradient id="bagGrad" x1="0.3" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#F5F0EA"/>
      <stop offset="100%" stop-color="#E8E0D5"/>
    </linearGradient>
    <!-- Terracotta handle gradient -->
    <linearGradient id="handleGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D08B72"/>
      <stop offset="100%" stop-color="#B06A52"/>
    </linearGradient>
    <!-- Shadow -->
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#0D3322" flood-opacity="0.25"/>
    </filter>
    <!-- Inner shadow for bag -->
    <filter id="innerGlow" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0D3322" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- Background: rounded square with forest green gradient -->
  <rect width="1024" height="1024" rx="220" ry="220" fill="url(#bgGrad)"/>

  <!-- Subtle texture overlay -->
  <rect width="1024" height="1024" rx="220" ry="220" fill="none" stroke="#2D8A66" stroke-width="2" opacity="0.3"/>

  <!-- Tote bag group, centered -->
  <g filter="url(#shadow)">
    <!-- Handles - terracotta colored, elegant curves -->
    <!-- Left handle -->
    <path d="M 370 390 C 370 270, 370 230, 420 200 C 470 170, 480 170, 512 170"
          fill="none" stroke="url(#handleGrad)" stroke-width="36" stroke-linecap="round"/>
    <!-- Right handle -->
    <path d="M 654 390 C 654 270, 654 230, 604 200 C 554 170, 544 170, 512 170"
          fill="none" stroke="url(#handleGrad)" stroke-width="36" stroke-linecap="round"/>

    <!-- Bag body - warm off-white with slight taper -->
    <path d="M 280 400 L 300 780 C 302 800, 316 820, 340 820 L 684 820 C 708 820, 722 800, 724 780 L 744 400 Z"
          fill="url(#bagGrad)" filter="url(#innerGlow)"/>

    <!-- Bag top fold/rim - slightly darker -->
    <path d="M 280 400 L 744 400 L 738 430 L 286 430 Z"
          fill="#E2DDD6"/>

    <!-- Decorative stripe at top - golden mustard accent -->
    <rect x="286" y="430" width="452" height="8" rx="2" fill="#BFA033" opacity="0.7"/>

    <!-- Checklist items on the bag -->
    <!-- Item 1 -->
    <g transform="translate(340, 490)">
      <!-- Checkmark circle -->
      <circle cx="22" cy="18" r="20" fill="#1B6B4E" opacity="0.12"/>
      <polyline points="12,18 20,26 34,10" fill="none" stroke="#1B6B4E" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- Line -->
      <rect x="58" y="11" width="220" height="14" rx="7" fill="#2D2A26" opacity="0.12"/>
    </g>

    <!-- Item 2 -->
    <g transform="translate(340, 570)">
      <circle cx="22" cy="18" r="20" fill="#1B6B4E" opacity="0.12"/>
      <polyline points="12,18 20,26 34,10" fill="none" stroke="#1B6B4E" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="58" y="11" width="180" height="14" rx="7" fill="#2D2A26" opacity="0.12"/>
    </g>

    <!-- Item 3 -->
    <g transform="translate(340, 650)">
      <circle cx="22" cy="18" r="20" fill="#BFA033" opacity="0.15"/>
      <polyline points="12,18 20,26 34,10" fill="none" stroke="#BFA033" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="58" y="11" width="250" height="14" rx="7" fill="#2D2A26" opacity="0.12"/>
    </g>

    <!-- Item 4 - unchecked, just a circle -->
    <g transform="translate(340, 730)">
      <circle cx="22" cy="18" r="18" fill="none" stroke="#9B958E" stroke-width="3.5" opacity="0.4"/>
      <rect x="58" y="11" width="160" height="14" rx="7" fill="#2D2A26" opacity="0.08"/>
    </g>
  </g>

  <!-- Small leaf accent near top-right of bag -->
  <g transform="translate(680, 340) rotate(-30)">
    <path d="M 0 0 C 10 -30, 35 -45, 50 -50 C 35 -30, 15 -15, 0 0 Z"
          fill="#3D9B6E" opacity="0.6"/>
    <line x1="0" y1="0" x2="30" y2="-32" stroke="#3D9B6E" stroke-width="2" opacity="0.4"/>
  </g>
</svg>