services:
  postgres:
    image: postgres:16-alpine
    container_name: tote-bag-postgres
    environment:
      POSTGRES_DB: tote_bag
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tote_bag"]
      interval: 10s
      timeout: 5s
      retries: 5

  supertokens:
    image: registry.supertokens.io/supertokens/supertokens-postgresql:11.4
    container_name: tote-bag-supertokens
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRESQL_CONNECTION_URI: postgresql://postgres:postgres@postgres:5432/tote_bag
      POSTGRESQL_TABLE_SCHEMA: public
    ports:
      - "3567:3567"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3567/hello"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tote-bag-backend
    depends_on:
      postgres:
        condition: service_healthy
      supertokens:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: tote_bag
      DB_USER: postgres
      DB_PASSWORD: postgres
      SUPERTOKENS_CONNECTION_URI: http://supertokens:3567
      API_DOMAIN: http://localhost:3333
      WEBSITE_DOMAIN: http://localhost:3333
      CORS_ORIGIN: "http://localhost:3000,http://localhost:3333,http://localhost:8080"
      OPENFOODFACTS_API_URL: https://world.openfoodfacts.org/api/v2
    ports:
      - "3333:3000"
    volumes:
      - ./backend/src:/app/src
      - ./backend/docs:/app/docs
      - ./backend/package.json:/app/package.json
      - ./backend/mikro-orm.config.js:/app/mikro-orm.config.js
      - ./backend/.env:/app/.env
    command: npm run dev
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  pgadmin:
    image: dpage/pgadmin4:8
    container_name: tote-bag-pgadmin
    user: root
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@totebag.dev
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "8081:80"
    volumes:
      - ./pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
