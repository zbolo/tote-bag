version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: tote-bag-postgres
    environment:
      POSTGRES_DB: tote_bag
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    # ports:
    #   - '5432:5432'
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  supertokens:
    image: registry.supertokens.io/supertokens/supertokens-postgresql:latest
    container_name: tote-bag-supertokens
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRESQL_CONNECTION_URI: postgresql://postgres:postgres@postgres:5432/tote_bag
      POSTGRESQL_TABLE_SCHEMA: supertokens
    ports:
      - "3567:3567"
    healthcheck:
      test: >
        bash -c 'exec 3<>/dev/tcp/127.0.0.1/3567 && echo -e "GET /hello HTTP/1.1\r\nhost: 127.0.0.1:3567\r\nConnection: close\r\n\r\n" >&3 && cat <&3 | grep "Hello"'
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tote-bag-backend
    depends_on:
      postgres:
        condition: service_healthy
      supertokens:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: tote_bag
      DB_USER: postgres
      DB_PASSWORD: postgres
      SUPERTOKENS_CONNECTION_URI: http://supertokens:3567
      API_DOMAIN: http://localhost:3333
      WEBSITE_DOMAIN: http://localhost:3333
      CORS_ORIGIN: "http://localhost:3000,http://localhost:3333,http://localhost:8080"
      OPENFOODFACTS_API_URL: https://world.openfoodfacts.org/api/v2
    ports:
      - "3333:3000"
    volumes:
      - ./backend/src:/app/src
      - ./backend/package.json:/app/package.json
      - ./backend/mikro-orm.config.js:/app/mikro-orm.config.js
      - ./backend/.env:/app/.env
    command: npm run dev
