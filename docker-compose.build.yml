services:
  backend:
    image: git.webdeploy.it/zbolo/tote-bag/backend
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    environment:
      NODE_ENV: production
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      SUPERTOKENS_CONNECTION_URI: http://supertokens:3567
      API_DOMAIN: ${API_DOMAIN}
      WEBSITE_DOMAIN: ${WEBSITE_DOMAIN}
    ports:
      - "3333:3000"
    restart: always

  backend-service-tag:
    extends: backend
    image: git.webdeploy.it/zbolo/tote-bag/backend:${TAG}
